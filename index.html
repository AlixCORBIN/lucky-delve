<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Lucky Delve</title>
    <style>
      /* Écran de chargement : affiché avant tout JS, sans dépendance. */
      html, body { margin: 0; height: 100%; background: #1f1a2e; }
      #loading {
        position: fixed; inset: 0; z-index: 20; display: grid; place-content: center; gap: 12px;
        background: #1f1a2e; color: #fff4e0; font: 600 18px/1.3 ui-rounded, system-ui, sans-serif; text-align: center;
      }
      #loading .loading-title { font-size: 40px; color: #f2b544; }
      #loading .loading-text { color: #c9bfd6; }
      #loading .loading-dots { display: flex; gap: 8px; justify-content: center; }
      #loading .loading-dots i { width: 10px; height: 10px; border-radius: 50%; background: #f2b544; animation: dot 900ms ease-in-out infinite; }
      #loading .loading-dots i:nth-child(2) { animation-delay: 150ms; }
      #loading .loading-dots i:nth-child(3) { animation-delay: 300ms; }
      #loading .loading-error { max-width: 90vw; color: #ef6f6c; white-space: pre-wrap; font: 14px/1.4 ui-monospace, monospace; }
      @keyframes dot { 50% { transform: translateY(-6px); opacity: 0.5; } }
      @media (prefers-reduced-motion: reduce) { #loading .loading-dots i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="loading-title">Lucky Delve</div>
      <div class="loading-dots"><i></i><i></i><i></i></div>
      <div class="loading-text">Chargement</div>
    </div>
    <div id="board"></div>
    <div id="screens"></div>
    <script>
      // Filet avant le module principal : une erreur de chargement s'affiche à l'écran.
      window.__bootError = function (msg) {
        var box = document.querySelector('#loading');
        if (!box || box.querySelector('.loading-error')) return;
        var p = document.createElement('div');
        p.className = 'loading-error';
        p.textContent = String(msg);
        box.appendChild(p);
      };
      window.addEventListener('error', function (e) { window.__bootError(e.message || e.error); });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
